x-env: &env
  CDMS_DSN: postgresql://postgres:postgres@postgres:5432/cdms
  CDMS_REDIS_URL: redis://redis:6379/0
  SHOPIFY_MOCK_URL: http://shopify-mock:8081
  VIETFUL_MOCK_URL: http://vietful-mock:8082
  WEBHOOK_URL: http://webhook:8090

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdms
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["6379:6379"]

  shopify-mock:
    build: .
    command: ["mock", "shopify-server", "--port", "8081"]
    restart: unless-stopped
    environment:
      SHOPIFY_MOCK_ERROR_RATE: "0.05"
      SHOPIFY_MOCK_BAD_RATIO: "0.05"
    ports: ["8081:8081"]

  vietful-mock:
    build: .
    command: ["mock", "vietful-api", "--port", "8082"]
    restart: unless-stopped
    environment:
      VIETFUL_MOCK_ERROR_RATE: "0.05"
      VIETFUL_MOCK_BAD_RATIO: "0.05"
      VIETFUL_MOCK_EVENT_FAULT_RATIO: "0.05"
    ports: ["8082:8082"]

  webhook:
    build: .
    command: ["webhook-server", "--port", "8090"]
    environment: *env
    restart: unless-stopped
    ports: ["8090:8090"]
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_started}

  seed:
    build: .
    entrypoint: ["sh", "scripts/seed_demo.sh"]
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      vietful-mock: {condition: service_started}

  agent:
    build: .
    command: ["agent"]
    environment: *env
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_started}
      shopify-mock: {condition: service_started}

  cli:
    build: .
    environment: *env
    profiles: ["tools"]
    depends_on: [postgres, redis]
